name: Diagnose release keystore

on:
  workflow_dispatch:

jobs:
  check:
    name: Check release keystore
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore and inspect keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -x
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > /tmp/diag-key.jks
          ls -l /tmp/diag-key.jks
          echo "--- keytool list ---"
          keytool -list -keystore /tmp/diag-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "${ANDROID_KEY_ALIAS:-upload}"
          echo "--- keytool list -v (fingerprint) ---"
          keytool -list -v -keystore /tmp/diag-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "${ANDROID_KEY_ALIAS:-upload}" | grep -E "Alias name|Owner|Valid from|SHA256"
          echo "--- key password check ---"
          keytool -certreq -keystore /tmp/diag-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "${ANDROID_KEY_ALIAS:-upload}" -keypass "$ANDROID_KEY_PASSWORD" -file /tmp/diag.csr && echo "KEY PASSWORD OK"
          rm -f /tmp/diag-key.jks /tmp/diag.csr
